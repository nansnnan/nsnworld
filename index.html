<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南山南的小天地</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<header class="hero">
  <p class="eyebrow">Welcome</p>
  <h1>南山南的小天地</h1>
  <p class="subtitle">探索这个小世界的东西</p>

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M20 20l-3.5-3.5"></path>
    </svg>
    <input id="search" type="search" placeholder="搜索站内功能，按 / 快速聚焦" autocomplete="off" aria-label="搜索站内功能">
    <kbd>Esc</kbd>
  </div>
</header>

<main>
  <div class="section-head">
    <h2>功能</h2>
    <span id="count" class="count"></span>
  </div>
  <section id="grid" class="grid"></section>
  <p id="empty" class="empty" hidden>没有找到相关的功能，换个关键词试试。</p>
</main>

<footer>© <span id="year"></span> 南山南的小天地</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
